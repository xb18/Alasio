<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Content-Security-Policy. The theme pre-paint
         script below is allowed through its sha256 hash (no
         'unsafe-inline'). frame-ancestors is NOT set here: the meta tag
         ignores it, the backend response header (SPANoCacheStaticFiles)
         carries the full policy including frame-ancestors 'self'
         app://bundle so the electron host can embed this page.
         Modifying the inline script below requires recomputing the hash. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-/c574zxOUzzzs52yM/ATmZ7eBGoJ3nHgHTc8O5t7jRw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'"
    />
    %sveltekit.head%
    <script>
      // Embedded sessions: the host (webapp) passes its display theme in the
      // iframe URL (?theme=dark|light). Apply it before the first paint so
      // the embedded app opens already themed. This is needed because
      // mode-watcher's FOUC script is not present in this SPA build
      // (ssr/prerender disabled), and even when present it only knows
      // localStorage/system preference, which can differ from the host
      // config on first run. Persist the value to mode-watcher's storage key
      // (its default modeStorageKey) so ModeWatcher's onMount initialization
      // keeps the same mode. Remote sessions without the theme param are
      // unaffected (per-client behavior preserved).
      (() => {
        try {
          const theme = new URLSearchParams(window.location.search).get("theme");
          if (theme === "light" || theme === "dark") {
            const root = document.documentElement;
            root.classList.toggle("dark", theme === "dark");
            root.style.colorScheme = theme;
            localStorage.setItem("mode-watcher-mode", theme);
          }
        } catch {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
