<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alasio</title>
    <!-- Content-Security-Policy. The inline script below is allowed
         through sha256 hashes (no 'unsafe-inline'); the build-time
         csp-inline-hash plugin rewrites the script-src hashes on every
         dev/build so they always cover the current inline scripts
         (including the sveltekit bootstrap script, which changes per
         build). frame-src allows the embedded frontend at the local
         backend (any port: the port is configurable). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-sxgASNsFgBHJcb1AyfshDaBMm9cm/P979ECS6ATmyfQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' http://127.0.0.1:*"
    />
    %sveltekit.head%
    <script>
      // Apply the host display theme before the first paint. Without this
      // the document canvas is white until the CSS/JS bundle loads (the
      // BrowserWindow backgroundColor only covers the pre-HTML window).
      // The theme is read synchronously from the main process via the
      // preload sendSync bridge (preload runs before page scripts); the
      // root layout effect keeps it in sync afterwards.
      (() => {
        try {
          const theme = window.electronAPI?.getSharedStateSync()?.theme;
          if (theme === "light" || theme === "dark") {
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
